<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>停顿回溯标注</title>
<link rel="stylesheet" href="/css/style.css?v=2.5">
<style>
  .instruction-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .instruction-card summary { font-weight: 700; cursor: pointer; font-size: 15px; }
  .instruction-body { margin-top: 8px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .save-status { font-size: 12px; color: #6b7280; }
  .save-status.saved { color: #059669; }
  .save-status.saving { color: #d97706; }
  .save-status.error { color: #dc2626; }
  .speaker-label { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .speaker-label.experimenter { color: #4b5563; }
  .speaker-label.participant { color: #2563eb; }
  /* 停顿标注样式 */
  .pause-marker {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    margin: 0 3px;
    vertical-align: middle;
    white-space: nowrap;
  }
  .pause-color-warm { background: #fed7aa; color: #7c2d12; border: 1px solid #fdba74; }
  .pause-color-hot  { background: #fecaca; color: #7f1d1d; border: 1px solid #fca5a5; }
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div>
    <strong id="title-display">停顿回溯标注</strong>
    <span class="save-status saved" id="save-status">已保存</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:14px;" id="progress-text">0/0</span>
    <progress id="progress-bar" value="0" max="100" style="width:120px;"></progress>
    <button class="btn btn-primary" id="submit-btn" disabled>提交</button>
  </div>
</div>

<div class="container" id="app">
  <div class="card" id="loading">加载中…</div>
</div>

<script>
const TOKEN = window.location.pathname.split('/').pop();
let sessionData = null;
let debounceTimers = {};
// Pending save promises keyed by targetId+field, so submit can flush them first
const pendingSaves = {};
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const speechSupported = typeof SpeechRecognition === 'function';
let activeSpeech = null;

// ── API helpers ──────────────────────────────────
const api = {
  async get() {
    const r = await fetch(`/api/a/${TOKEN}`);
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async patch(targetId, body) {
    const r = await fetch(`/api/a/${TOKEN}/annotations/${targetId}`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async submit() {
    const r = await fetch(`/api/a/${TOKEN}/submit`, { method: 'POST' });
    if (!r.ok) {
      const err = await r.json();
      const detail = err.detail;
      if (detail && typeof detail === 'object' && detail.incomplete) {
        const hints = detail.incomplete.map(x => x.display_hint || x.target_id).join('、');
        throw new Error(`还有未完成的标记：${hints}。请检查类别、描述和置信度是否都已填写并保存。`);
      }
      throw new Error(typeof detail === 'object' ? JSON.stringify(detail) : (detail || '提交失败'));
    }
    return r.json();
  }
};

// ── Save status ─────────────────────────────────
function setSaveStatus(state) {
  const el = document.getElementById('save-status');
  el.className = 'save-status ' + state;
  el.textContent = {saved:'已保存', saving:'保存中…', error:'保存失败'}[state] || state;
}

function autoSave(targetId, field, value) {
  setSaveStatus('saving');
  clearTimeout(debounceTimers[targetId + field]);
  const key = targetId + field;
  const delay = field === 'confidence' ? 0 : 800;
  const p = new Promise((resolve, reject) => {
    debounceTimers[key] = setTimeout(async () => {
      try {
        await api.patch(targetId, { [field]: value });
        setSaveStatus('saved');
        updateProgress();
        resolve();
      } catch(e) {
        setSaveStatus('error');
        console.error(e);
        reject(e);
      } finally {
        delete pendingSaves[key];
      }
    }, delay);
  });
  pendingSaves[key] = p;
  // Autosave is intentionally fire-and-forget. Keep the original rejecting
  // promise in pendingSaves so an explicit submit can still report failures.
  p.catch(() => {});
}

async function flushPendingSaves() {
  // Cancel debounce timers and fire immediate saves for any pending form values
  document.querySelectorAll('.annotation-form').forEach(form => {
    const targetId = form.dataset.targetId;
    const cat = form.querySelector('select')?.value;
    const desc = form.querySelector('textarea')?.value.trim();
    const conf = form.querySelector('.confidence-btn.selected')?.dataset?.value;
    // Clear pending timers and force immediate PATCH of current values
    ['category', 'description', 'confidence'].forEach(field => {
      const key = targetId + field;
      clearTimeout(debounceTimers[key]);
      delete debounceTimers[key];
    });
    if (cat) {
      pendingSaves[targetId + 'category'] = api.patch(targetId, { category: cat });
    }
    if (desc) {
      pendingSaves[targetId + 'description'] = api.patch(targetId, { description: desc });
    }
    if (conf) {
      pendingSaves[targetId + 'confidence'] = api.patch(targetId, { confidence: parseInt(conf) });
    }
  });
  const pending = Object.values(pendingSaves);
  if (pending.length) {
    setSaveStatus('saving');
    await Promise.all(pending);
    setSaveStatus('saved');
  }
}

// ── Progress ────────────────────────────────────
function updateProgress() {
  const targets = document.querySelectorAll('.annotation-form');
  let done = 0;
  targets.forEach(f => {
    const cat = f.querySelector('select')?.value;
    const desc = f.querySelector('textarea')?.value.trim();
    const conf = f.querySelector('.confidence-btn.selected')?.dataset?.value;
    // cat must be a real selection (not empty placeholder)
    if (cat && desc && conf) done++;
  });
  const total = targets.length;
  document.getElementById('progress-text').textContent = `${done}/${total}`;
  document.getElementById('progress-bar').value = total ? (done / total) * 100 : 0;
  document.getElementById('submit-btn').disabled = done < total;
}

function setSpeechStatus(statusEl, text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', isError);
}

function appendSpeechText(current, transcript) {
  const text = transcript.trim();
  if (!text) return current;
  const trimmed = current.trimEnd();
  if (!trimmed) return text;
  if (current !== trimmed) return current + text;
  const lastCharacter = trimmed.slice(-1);
  const punctuation = '，。！？；：、';
  const separator = punctuation.includes(lastCharacter) ? '' : ' ';
  return trimmed + separator + text;
}

function finishSpeech(state, message = '', isError = false) {
  if (state.finished) return;
  state.finished = true;
  if (activeSpeech === state) activeSpeech = null;
  state.button.classList.remove('listening');
  state.button.setAttribute('aria-pressed', 'false');
  state.button.textContent = '语音输入';
  setSpeechStatus(state.status, message, isError);
  state.resolveDone();
}

function stopSpeech(state) {
  if (!state) return Promise.resolve();
  state.userStopped = true;
  try {
    state.recognition.stop();
  } catch (e) {
    finishSpeech(state, '已停止');
  }
  return state.done;
}

async function toggleSpeech(textarea, button, status) {
  if (activeSpeech && activeSpeech.textarea === textarea) {
    await stopSpeech(activeSpeech);
    return;
  }
  if (activeSpeech) await stopSpeech(activeSpeech);

  let resolveDone;
  const done = new Promise(resolve => { resolveDone = resolve; });
  const recognition = new SpeechRecognition();
  const state = {
    recognition, textarea, button, status, done, resolveDone,
    finished: false, userStopped: false
  };
  activeSpeech = state;
  button.classList.add('listening');
  button.setAttribute('aria-pressed', 'true');
  button.textContent = '停止';
  setSpeechStatus(status, '正在启动…');

  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.onstart = () => {
    if (!state.finished) setSpeechStatus(status, '正在聆听…');
  };
  recognition.onresult = event => {
    if (state.finished) return;
    let finalTranscript = '';
    let interimTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += transcript;
      else interimTranscript += transcript;
    }
    if (finalTranscript.trim()) {
      textarea.value = appendSpeechText(textarea.value, finalTranscript);
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
    }
    setSpeechStatus(status, interimTranscript.trim() ? `正在聆听：${interimTranscript.trim()}` : '正在聆听…');
  };
  recognition.onerror = event => {
    if (state.finished) return;
    if (state.userStopped && event.error === 'aborted') {
      finishSpeech(state, '已停止');
      return;
    }
    const messages = {
      'not-allowed': '麦克风权限被拒绝，请在浏览器设置中允许麦克风。',
      'service-not-allowed': '当前浏览器不允许使用语音识别服务。',
      'audio-capture': '未检测到可用麦克风，请检查设备。',
      network: '语音识别网络错误，请检查网络后重试。',
      'no-speech': '没有识别到语音，请重试。',
      'language-not-supported': '当前浏览器不支持中文语音识别。'
    };
    finishSpeech(state, messages[event.error] || '语音识别失败，请重试。', true);
  };
  recognition.onend = () => {
    if (state.finished) return;
    finishSpeech(state, state.userStopped ? '已停止' : '语音输入已结束');
  };
  try {
    recognition.start();
  } catch (e) {
    finishSpeech(state, '无法启动语音输入，请重试。', true);
  }
}

// ── Render ──────────────────────────────────────
function render(data) {
  sessionData = data;
  document.getElementById('title-display').textContent = data.title || '停顿回溯标注';

  const isReadonly = data.status === 'submitted';

  let html = '';

  // Instruction
  if (data.instruction) {
    html += `<details class="instruction-card" open>
      <summary>填写说明</summary>
      <div class="instruction-body">${escapeHtml(data.instruction)}</div>
    </details>`;
  }

  // Dialogue
  if (!data.utterances || data.utterances.length === 0) {
    html += '<div class="card"><p>暂无对话数据。</p></div>';
  } else {
    html += `<section class="dialogue-shell" aria-label="对话内容">
      <div class="dialogue-heading"><h2>对话</h2></div>
      <div class="dialogue-thread">`;
    for (const u of data.utterances) {
      const speakerClass = u.speaker === 'experimenter' ? 'experimenter' : 'participant';
      const speakerName = u.speaker === 'experimenter' ? '主试' : '被试';
      html += `<article class="chat-row chat-row-${speakerClass}">
        <div class="chat-bubble chat-bubble-${speakerClass}">
          <div class="chat-meta"><span class="speaker-label ${speakerClass}">${speakerName}</span></div>
          <div class="chat-text">${speakerClass === 'experimenter' ? renderPlainUtteranceText(u) : renderUtteranceText(u)}</div>`;

      // One annotation form for every pause target in this utterance.
      for (const t of (u.annotation_targets || [])) {
        const ann = t.annotation || {};
        html += renderAnnotationForm(t, ann, isReadonly);
      }

      html += '</div></article>';
    }
    html += '</div></section>';
  }

  // Submitted notice
  if (isReadonly) {
    html = '<div class="submission-notice" role="status">你已提交完成。以下为只读查看。</div>' + html;
  }

  document.getElementById('app').innerHTML = html;

  // Bind events
  if (!isReadonly) {
    document.querySelectorAll('.annotation-form').forEach(form => {
      const targetId = form.dataset.targetId;
      const textarea = form.querySelector('textarea');
      form.querySelector('select').addEventListener('change', e => {
        autoSave(targetId, 'category', e.target.value);
      });
      textarea.addEventListener('input', e => {
        autoSave(targetId, 'description', e.target.value);
      });
      const speechButton = form.querySelector('.speech-input-btn');
      if (speechButton) {
        const speechStatus = form.querySelector('.speech-status');
        speechButton.addEventListener('click', () => {
          toggleSpeech(textarea, speechButton, speechStatus);
        });
      }
      form.querySelectorAll('.confidence-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          form.querySelectorAll('.confidence-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          autoSave(targetId, 'confidence', parseInt(btn.dataset.value));
        });
      });
    });
    document.getElementById('submit-btn').addEventListener('click', handleSubmit);
  }

  updateProgress();
}

function renderAnnotationForm(target, ann, readonly) {
  const categories = JSON.parse(document.getElementById('categories-data')?.textContent || '[]');
  // Placeholder so the first real category is NOT auto-selected without user action
  const placeholder = `<option value="" ${ann.category ? '' : 'selected'} disabled>请选择类别…</option>`;
  const hasCurrentCategory = categories.some(c => c.value === ann.category);
  const legacyCategory = ann.category && !hasCurrentCategory
    ? `<option value="${escapeHtml(ann.category)}" selected>历史类别（${escapeHtml(ann.category)}）</option>`
    : '';
  const catOptions = placeholder + legacyCategory + categories.map(c =>
    `<option value="${escapeHtml(c.value)}" ${ann.category === c.value ? 'selected' : ''}>${escapeHtml(c.label)}</option>`
  ).join('');

  const confHtml = [1,2,3,4,5,6,7].map(v =>
    `<button type="button" class="confidence-btn ${ann.confidence === v ? 'selected' : ''}" data-value="${v}" ${readonly?'disabled':''}>${v}</button>`
  ).join('');

  return `<div class="annotation-form" data-target-id="${target.id}">
    <div class="target-label">标记：<strong>${escapeHtml(target.display_hint || target.label)}</strong>${target.required ? '（必填）' : ''}</div>
    <label>原因类别</label>
    <select ${readonly?'disabled':''}>${catOptions}</select>
    <label>原因与心理过程</label>
    <div class="description-input">
      <textarea rows="3" style="resize:none;overflow-y:auto;" placeholder="请描述当时停顿的原因…" ${readonly?'disabled':''}>${escapeHtml(ann.description || '')}</textarea>
      ${!readonly && speechSupported ? `<div class="speech-controls">
        <button type="button" class="speech-input-btn" aria-label="使用语音输入原因与心理过程" aria-pressed="false">语音输入</button>
        <span class="speech-status" role="status" aria-live="polite"></span>
      </div>` : ''}
    </div>
    <label>你在多大程度上确信该停顿原因的描述？1=完全不确信，7=完全确信</label>
    <div class="confidence-row">${confHtml}</div>
  </div>`;
}

async function handleSubmit() {
  if (!confirm('确认提交？提交后不可再修改。')) return;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try {
    await stopSpeech(activeSpeech);
    // Flush any pending debounced saves before submitting
    await flushPendingSaves();
    await api.submit();
    alert('提交成功！');
    location.reload();
  } catch(e) {
    alert('提交失败：' + e.message);
    updateProgress(); // re-enable button if still complete
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/**
 * 将 utterance 文本渲染为带停顿标注的 HTML。
 * 优先使用 raw_text（含 <PAUSE:x.xs> 标记），否则回退到 text。
 * 仅显示 0.5s 及以上的 pause；不同停顿时长使用不同颜色，不显示等级名称。
 */
function renderUtteranceText(u) {
  const source = u.raw_text || u.text || '';
  if (!source.includes('<PAUSE:')) {
    return `<p>${escapeHtml(source)}</p>`;
  }
  const parts = source.split(/(<PAUSE:\d+(?:\.\d+)?s>)/);
  const inner = parts.map(part => {
    const m = part.match(/^<PAUSE:(\d+(?:\.\d+)?)s>$/);
    if (m) {
      const sec = parseFloat(m[1]);
      if (sec < 0.5) return '';
      const color = sec >= 0.80 ? 'hot' : 'warm';
      return `<span class="pause-marker pause-color-${color}" title="停顿 ${m[1]}s">停顿 ${m[1]}s</span>`;
    }
    return escapeHtml(part);
  }).join('');
  return `<p>${inner}</p>`;
}

function renderPlainUtteranceText(u) {
  return `<p>${escapeHtml(u.text || '')}</p>`;
}

// ── Init ─────────────────────────────────────────
(async () => {
  try {
    // load categories from settings (fetched via session metadata or separate call)
    // We embed them via a small inline fetch
    const catResp = await fetch('/api/admin/settings');
    let categories = [];
    if (catResp.ok) {
      const settings = await catResp.json();
      categories = settings.reason_categories || [];
    }
    // embed categories for render function
    const script = document.createElement('script');
    script.id = 'categories-data';
    script.type = 'application/json';
    script.textContent = JSON.stringify(categories);
    document.head.appendChild(script);

    const data = await api.get();
    render(data);
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="card" style="color:#dc2626;">加载失败：${escapeHtml(e.message)}<br>请确认链接正确且已由主试创建会话。</div>`;
  }
})();
</script>
</body>
</html>
